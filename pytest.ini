[pytest]

pythonpath = .

log_cli = true
log_cli_level = DEBUG
log_cli_format = %(asctime)s %(levelname)s %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
addopts = -p no:warnings


markers =
    debug: debug
    api: api automation
    params: params
    acc: account
    profile: profile
    test: test
    trans: transfer